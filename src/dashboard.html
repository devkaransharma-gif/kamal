<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Testbook Sales Management Dashboard</title>
<style>
body{font-family:Inter,system-ui,sans-serif;margin:0;background:#f6f7fb;color:#172033}.wrap{max-width:1400px;margin:auto;padding:24px}
h1{margin:0}.muted{color:#667085}.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:18px 0}
.card,.panel{background:#fff;border:1px solid #e6e8ee;border-radius:14px;padding:16px;box-shadow:0 2px 8px rgba(16,24,40,.04)}.label{font-size:12px;color:#667085}.value{font-size:24px;font-weight:750;margin-top:6px}
.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:14px}.tab{white-space:nowrap;border:1px solid #d0d5dd;background:#fff;border-radius:9px;padding:9px 13px;cursor:pointer}.tab.active{background:#172033;color:#fff}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.filters select{padding:9px;border:1px solid #d0d5dd;border-radius:8px;background:white}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #eef0f4}th{font-size:11px;color:#667085;text-transform:uppercase}td.right,th.right{text-align:right}
.badge{padding:4px 7px;border-radius:999px;font-size:11px;font-weight:700}.good{background:#dcfae6;color:#067647}.warn{background:#fef0c7;color:#b54708}.bad{background:#fee4e2;color:#b42318}.neutral{background:#eef2f6;color:#475467}
.small{font-size:12px}.error{color:#b42318}.refresh{border:1px solid #d0d5dd;background:white;border-radius:8px;padding:8px 12px;cursor:pointer}
@media(max-width:1100px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}.wrap{padding:14px}}
</style></head>
<body><div class="wrap">
<h1>Testbook Sales Management Dashboard</h1><div class="muted">Manager → TL → Counselor → Product | Today / MTD | Target / Achievement / Incentive</div>
<div class="toolbar"><div id="status" class="muted">Loading…</div><button class="refresh" onclick="load()">↻ Refresh</button></div>
<div class="grid">
<div class="card"><div class="label">Today Revenue</div><div id="todayRevenue" class="value">—</div></div>
<div class="card"><div class="label">MTD Revenue</div><div id="mtdRevenue" class="value">—</div></div>
<div class="card"><div class="label">Today Orders</div><div id="todayOrders" class="value">—</div></div>
<div class="card"><div class="label">MTD Orders</div><div id="mtdOrders" class="value">—</div></div>
<div class="card"><div class="label">MTD Target</div><div id="mtdTarget" class="value">—</div></div>
<div class="card"><div class="label">Achievement</div><div id="achievement" class="value">—</div></div>
</div>
<div class="panel">
<div class="tabs">
<button class="tab active" data-tab="managers">Manager</button><button class="tab" data-tab="tls">TL</button><button class="tab" data-tab="counselors">Counselor</button><button class="tab" data-tab="products">Product</button><button class="tab" data-tab="dateWise">Date-wise</button>
</div>
<div class="filters"><select id="managerFilter"><option value="">All Managers</option></select><select id="tlFilter"><option value="">All TLs</option></select><select id="dateRange"><option value="mtd">This Month</option><option value="last7">Last 7 Days</option><option value="last30">Last 30 Days</option></select></div>
<table><thead><tr id="head"></tr></thead><tbody id="rows"><tr><td>Loading…</td></tr></tbody></table>
</div></div>
<script>
let data=null,mode="managers";
const money=n=>"₹"+Number(n||0).toLocaleString("en-IN",{maximumFractionDigits:0});
const pct=n=>n==null?"—":Number(n).toFixed(1)+"%";
const esc=v=>String(v??"Unknown").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
function badge(a){if(a==null)return '<span class="badge neutral">No target</span>';const c=a>=100?"good":a>=80?"warn":"bad";return '<span class="badge '+c+'">'+pct(a)+'</span>'}
async function load(){
 try{const r=await fetch("/sales/summary",{cache:"no-store"});if(!r.ok)throw new Error("API returned "+r.status);data=await r.json();
 document.getElementById("todayRevenue").textContent=money(data.todayRevenue);document.getElementById("mtdRevenue").textContent=money(data.mtdRevenue);
 document.getElementById("todayOrders").textContent=(data.todayOrders||0).toLocaleString("en-IN");document.getElementById("mtdOrders").textContent=(data.mtdOrders||0).toLocaleString("en-IN");
 const target=(data.managers||[]).reduce((s,x)=>s+(x.target||0),0);document.getElementById("mtdTarget").textContent=money(target);
 document.getElementById("achievement").textContent=target?pct(data.mtdRevenue/target*100):"—";
 document.getElementById("status").textContent="Updated "+new Date().toLocaleString("en-IN");populateFilters();render();
 }catch(e){document.getElementById("status").innerHTML='<span class="error">Dashboard error: '+esc(e.message)+'</span>'}
}
function populateFilters(){
 const managers=[...new Set((data.tls||[]).map(x=>x.manager))].sort();const tls=[...new Set((data.counselors||[]).map(x=>x.tl))].sort();
 const mf=document.getElementById("managerFilter"),tf=document.getElementById("tlFilter"),mv=mf.value,tv=tf.value;
 mf.innerHTML='<option value="">All Managers</option>'+managers.map(x=>'<option>'+esc(x)+'</option>').join("");tf.innerHTML='<option value="">All TLs</option>'+tls.map(x=>'<option>'+esc(x)+'</option>').join("");mf.value=managers.includes(mv)?mv:"";tf.value=tls.includes(tv)?tv:"";
}
function render(){
 let list=data?.[mode]||[];const manager=document.getElementById("managerFilter").value,tl=document.getElementById("tlFilter").value;
 if(mode==="dateWise"){\n  const range=document.getElementById("dateRange").value;\n  const now=new Date(); const start=new Date(now.getFullYear(),now.getMonth(),now.getDate());\n  if(range==="last7") start.setDate(start.getDate()-6);\n  if(range==="last30") start.setDate(start.getDate()-29);\n  list=list.filter(x=>{const d=new Date(x.date+"T00:00:00"); return d>=start && d<=now;});\n  list=[...list].sort((a,b)=>a.date.localeCompare(b.date));\n}\n if(mode==="tls")list=list.filter(x=>!manager||x.manager===manager);
 if(mode==="counselors")list=list.filter(x=>(!manager||x.manager===manager)&&(!tl||x.tl===tl));
 const heads={dateWise:["Date","Leads","Sales","CVR","Revenue"],managers:["Rank","Manager","Today","MTD Revenue","Target","Achievement","Orders","Incentive"],tls:["Rank","Manager","TL","Today","MTD Revenue","Target","Achievement","Orders"],counselors:["Rank","Manager","TL","Counselor","Today","MTD Revenue","Target","Achievement","Orders"],products:["Rank","Product","Today","MTD Revenue","Orders","Contribution"]};
 document.getElementById("head").innerHTML=heads[mode].map((h,i)=>'<th class="'+(["Today","MTD Revenue","Target","Achievement","Orders","Contribution","Incentive"].includes(h)?"right":"")+'">'+h+"</th>").join("");
 document.getElementById("rows").innerHTML=list.length?list.map((x,i)=>{
  if(mode==="dateWise")return '<tr><td><b>'+esc(x.date)+'</b></td><td class="right">'+x.leads.toLocaleString("en-IN")+'</td><td class="right">'+x.sales.toLocaleString("en-IN")+'</td><td class="right">'+pct(x.cvr)+'</td><td class="right">'+money(x.revenue)+'</td></tr>';
  if(mode==="managers")return '<tr><td>'+ (i+1)+'</td><td><b>'+esc(x.manager)+'</b></td><td class="right">'+money(x.todayRevenue)+'</td><td class="right">'+money(x.revenue)+'</td><td class="right">'+money(x.target)+'</td><td class="right">'+badge(x.achievement)+'</td><td class="right">'+x.orders+'</td><td class="right">'+(x.incentive?.current?money(x.incentive.current.incentive):"—")+'</td></tr>';
  if(mode==="tls")return '<tr><td>'+(i+1)+'</td><td>'+esc(x.manager)+'</td><td><b>'+esc(x.tl)+'</b></td><td class="right">'+money(x.todayRevenue)+'</td><td class="right">'+money(x.revenue)+'</td><td class="right">'+money(x.target)+'</td><td class="right">'+badge(x.achievement)+'</td><td class="right">'+x.orders+'</td></tr>';
  if(mode==="counselors")return '<tr><td>'+(i+1)+'</td><td>'+esc(x.manager)+'</td><td>'+esc(x.tl)+'</td><td><b>'+esc(x.counselor)+'</b></td><td class="right">'+money(x.todayRevenue)+'</td><td class="right">'+money(x.revenue)+'</td><td class="right">'+money(x.target)+'</td><td class="right">'+badge(x.achievement)+'</td><td class="right">'+x.orders+'</td></tr>';
  return '<tr><td>'+(i+1)+'</td><td><b>'+esc(x.product)+'</b></td><td class="right">'+money(x.todayRevenue)+'</td><td class="right">'+money(x.revenue)+'</td><td class="right">'+x.orders+'</td><td class="right">'+pct(x.contribution)+'</td></tr>';
 }).join(""):'<tr><td colspan="9">No data available</td></tr>';
}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");mode=b.dataset.tab;render()});
document.getElementById("managerFilter").onchange=render;document.getElementById("tlFilter").onchange=render;document.getElementById("dateRange").onchange=render;
load();setInterval(load,60000);
</script></body></html>

name: Testbook Sales Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "15 * * * *"

concurrency:
  group: testbook-sales-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      TESTBOOK_API_URL: ${{ secrets.TESTBOOK_API_URL }}
      TESTBOOK_API_KEY: ${{ secrets.TESTBOOK_API_KEY }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - run: npm install
      - run: npm run sync
